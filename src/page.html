<title>Luringen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Norsk festspill for 3–10 spillere: alle får samme hemmelige ord – bortsett fra luringen. Over 3000 ord, fire nivåer, gratis og uten reklame.">
<style>/*STIL*/</style>
<!--KROPP-->
<div class="scene" aria-hidden="true"></div>
<div class="app" id="app">
  <header class="topp" id="topp">
    <a class="topp-merke rusj" id="tilportal" href="/" aria-label="Alle spill på rusj.no" hidden><svg class="pil" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><!--RUSJLOGO--></a>
    <button class="ikonknapp" id="tilbake" data-h="tilbake" aria-label="Tilbake" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="topp-tittel" id="topp-tittel"></span>
    <button class="ikonknapp" id="lydknapp" data-h="lyd" aria-label="Lyd" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fylt" d="M4 9h4l5-4v14l-5-4H4z"/><path class="bolge" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="kryss" d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </header>
  <main id="hoved">
    <section class="skjerm" id="s-hjem" aria-labelledby="t-hjem"></section>
    <section class="skjerm" id="s-oppsett" hidden></section>
    <section class="skjerm" id="s-del" hidden></section>
    <section class="skjerm" id="s-kode" hidden></section>
    <section class="skjerm" id="s-diskusjon" hidden></section>
    <section class="skjerm" id="s-pek" hidden></section>
    <section class="skjerm" id="s-avslor" hidden></section>
    <section class="skjerm" id="s-resultat" hidden></section>
    <section class="skjerm" id="s-bli-med" hidden></section>
    <section class="skjerm" id="s-plass" hidden></section>
    <section class="skjerm" id="s-gjest" hidden></section>
    <section class="skjerm" id="s-regler" hidden></section>
  </main>
</div>
<div class="ark-bakgrunn" id="ark" hidden>
  <div class="ark" role="dialog" aria-modal="true" aria-labelledby="ark-tittel" id="ark-innhold"></div>
</div>
<div class="nedtelling" id="nedtelling" hidden aria-live="assertive"></div>
<canvas class="konfetti" id="konfetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" aria-hidden="true"></div>
<div class="vh" id="si" aria-live="polite"></div>
<p id="mappe-trykk" hidden>Trykk for å vise kortet, og en gang til for å skjule det.</p>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="stempel-ruff" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" result="stoy"/>
    <feDisplacementMap in="SourceGraphic" in2="stoy" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<noscript><p style="padding:24px;color:#fff1dd;background:#150c28">Luringen trenger JavaScript for å kjøre.</p></noscript>
